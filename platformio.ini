; PlatformIO project configuration for FastLedClock
; Adjust [env] board/monitor_speed to match your hardware.

[env:nanoatmega328]
platform = atmelavr
board = nanoatmega328
framework = arduino
monitor_speed = 115200
lib_deps =
    paulstoffregen/Time@^1.6.1
    paulstoffregen/DS1307RTC@^1.4.3
    fastled/FastLED@^3.6.0
build_flags = -Wall
